# Metadata for the plugin
plugin:
    # Global plugin attributes
    type: interface                 # plugin type (gateway, interface, protocol, system, web)
    description:
        de: 'Positions- und Winkelsteuerung für Rollläden/Jalousien ohne Rückmeldung (z.B. Roto-Dachfenster-Antriebe)'
        en: 'Position and blade-angle control for shutters without position feedback (e.g. Roto roof window actuators)'
    maintainer: ivande
#    tester:                         # Who tests this plugin?
    state: develop                  # Initial 'develop'. change to 'ready' when done with development
#    keywords: shutter jalousie rollladen roto
#    documentation: ''              # An url to optional plugin doc - NOT the url to user_doc!!!
#    support: https://knx-user-forum.de/forum/supportforen/smarthome-py

    version: 2.0.0                  # Plugin version (must match the version specified in __init__.py)

    # these min/max-versions MUST be given in quotes, or e.g. 3.10 will be interpreted as 3.1 (3.1 < 3.9 < 3.10)
    sh_minversion: '1.10'           # minimum shNG version to use this plugin
#    sh_maxversion: ''              # maximum shNG version to use this plugin (omit if latest)

    multi_instance: false           # plugin supports multi instance
    restartable: unknown            # plugin supports stopping and starting again, must be implemented
    classname: Roto                 # class containing the plugin

parameters:
    # item to toggle plugin execution, remove if not wanted
    pause_item:
        type: str
        default: ''
        description:
            de: 'Item, um die Ausführung des Plugins zu steuern'
            en: 'item for controlling plugin execution'

item_attributes:
    # Definition of item attributes defined by this plugin.
    #
    # roto_plugin marks the *configuration* item of a shutter. It must sit on an item
    # whose parent item has the child items 'move', 'pos' and 'winkel' - see item_structs.shutter
    # below, which creates 'pos'/'winkel'/'Roto' as siblings of a 'move' item you define yourself.

    roto_plugin:
        type: str
        mandatory: True
        valid_list:
            - 'active'
        valid_list_description:
            de: ['Aktiviert das Plugin für diese Jalousie']
            en: ['Activates the plugin for this shutter']
        description:
            de: 'Kennzeichnet das Item als Konfigurations-Item einer Roto-Jalousie.'
            en: 'Marks the item as the configuration item of a Roto shutter.'
    roto_time_up:
        type: num
        default: 60
        description:
            de: 'benötigte Zeit (Sekunden) zum Hochfahren'
            en: 'Time (seconds) for a complete upward move'
    roto_time_down:
        type: num
        default: 60
        description:
            de: 'benötigte Zeit (Sekunden) zum Runterfahren'
            en: 'Time (seconds) for a complete downward move'
    roto_angle_step:
        type: num
        default: 10
        description:
            de: 'Winkel pro ausgeführtem Schritt im Schrittbetrieb des Aktors'
            en: 'Angle increment in step mode of the actor'
    roto_angle_hyst:
        type: num
        default: 0
        description:
            de: 'Anzahl Schritte Hysterese beim Aufwärts-Schrittbetrieb des Aktors (0 = keine Hysterese)'
            en: 'Number of steps hysteresis when moving angle stepwise up (0 = no hysteresis)'
    roto_cycle_time:
        type: num
        default: 5
        description:
            de: 'Zykluszeit (Sekunden) für die Positions-Nachführung während einer Fahrt'
            en: 'Cycle time (seconds) for position tracking while moving'

item_structs:
    shutter:
        name: Vorlage-Struktur für Roto-Jalousien (Positions-/Winkelsteuerung über einen Aktor ohne Rückmeldung)

        pos:
            remark: actual value of the shutter position (0 = open, 100 = closed)
            type: num
            cache: True
            visu_acl: rw

            soll:
                remark: set value for the shutter position
                type: num
                visu_acl: rw
                enforce_updates: True

        winkel:
            remark: actual value of the shutter blade angle (0 = open, 90 = closed)
            type: num
            cache: True
            visu_acl: rw

            soll:
                remark: set value for the shutter blade angle
                type: num
                visu_acl: rw
                enforce_updates: True

        Roto:
            remark: configuration item for this shutter - carries no value of its own
            roto_plugin: active
            # ----------------------------------------------------------------
            # individual shutter settings, set on the item using this struct
            # ----------------------------------------------------------------
            # roto_time_up: full upward travel time in seconds
            # roto_time_down: full downward travel time in seconds
            # roto_angle_step: blade angle difference per step in stepping mode
            # roto_angle_hyst: blade angle hysteresis - steps before upward movement starts
            # roto_cycle_time: cycle time (seconds) for position tracking while moving

plugin_functions: NONE
    # Definition of plugin functions defined by this plugin

logic_parameters: NONE
    # Definition of logic parameters defined by this plugin
